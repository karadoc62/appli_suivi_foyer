services:
  postgres:
    image: postgres:18-alpine
    container_name: foyer-postgres-dev

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - foyer_postgres_dev:/var/lib/postgresql

volumes:
  foyer_postgres_dev: